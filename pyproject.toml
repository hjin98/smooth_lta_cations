[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lta-cation-generator"
version = "7.15.0"
description = "Grouped-site LTA cation population and symmetry tools"
requires-python = ">=3.10"
dependencies = ["numpy", "pymatgen"]

[project.optional-dependencies]
symmetry = ["spglib>=2.0"]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = [
  "lta_cation_population_grouped",
  "lta_cation_density_grouped",
  "generate_smooth_lta_cations_grouped",
  "lta_cation_template",
  "lta_cation_symmetry",
  "lta_cation_subgroups",
  "lta_cation_maxsym",
  "lta_cation_maxsym_io",
  "lta_cation_symmetry_smoothing",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Set OLD_ERROR_HANDLING to false.*:DeprecationWarning:spglib.*",
]
