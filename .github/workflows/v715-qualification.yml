name: v7.15 qualification

on:
  push:
    branches:
      - v7.15-chloride-occlusion-implementation
    paths-ignore:
      - qualification/v715-ci/**

permissions:
  contents: write

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,symmetry]'
      - name: Focused v7.15 tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_v715_chloride_occlusion.py 2>&1 | tee /tmp/v715-focused.txt
      - name: Full native suite
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/v715-full.txt
      - name: Occluded CLI end-to-end
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "7.15.0", version
          PY
          mkdir -p /tmp/v715-e2e
          for ext in cif POSCAR data; do
            python lta_cation_population_grouped.py \
              tests/real_lta_primitive.cif "/tmp/v715-e2e/occluded.$ext" \
              --n4 Na:2 --n6 Na:16 --n8 Na:6 \
              --alpha-cl 1 --occlusion-n4 Cs:1 --seed 1715 \
              --report "/tmp/v715-e2e/report.$ext.txt"
          done
          python - <<'PY' | tee /tmp/v715-e2e.txt
          from collections import Counter
          from pathlib import Path
          from pymatgen.core import Structure
          from pymatgen.io.lammps.data import LammpsData

          root = Path("/tmp/v715-e2e")
          for name in ("occluded.cif", "occluded.POSCAR", "occluded.data"):
              path = root / name
              if path.suffix == ".data":
                  structure = LammpsData.from_file(str(path), atom_style="atomic").structure
                  text = path.read_text()
                  section = text.split("Atoms", 1)[1]
                  rows = [line.split() for line in section.splitlines() if line.strip() and line.lstrip()[0].isdigit()]
                  assert rows and all(len(row) == 5 for row in rows)
              else:
                  structure = Structure.from_file(str(path))
              counts = Counter(site.specie.symbol for site in structure)
              assert counts == Counter({"O": 96, "Si": 24, "Al": 24, "Na": 24, "Cs": 1, "Cl": 1}), (name, counts)
              report = (root / ("report." + name.split(".", 1)[1] + ".txt")).read_text()
              assert "Framework charge invariant: PASS" in report
              assert "Occlusion charge invariant: PASS" in report
          print("v7.15 occluded CLI CIF/POSCAR/LAMMPS round trip: PASS")
          PY
      - name: v7.14.2 dry differential compatibility
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/v7142
          cur=/tmp/v715
          mkdir -p "$base" "$cur"
          git archive a10fb47391adc509b6fcd048e261eac82ba83fbd | tar -x -C "$base"
          for ext in cif POSCAR data; do
            python "$base/lta_cation_population_grouped.py"               "$base/tests/real_lta_primitive.cif" "$base/dry.$ext"               --n4 Na:2 --n6 Na:16 --n8 Na:6 --seed 1715               > "$base/report.$ext.txt"
            python lta_cation_population_grouped.py               tests/real_lta_primitive.cif "$cur/dry.$ext"               --n4 Na:2 --n6 Na:16 --n8 Na:6 --seed 1715               > "$cur/report.$ext.txt"
            cmp "$base/dry.$ext" "$cur/dry.$ext"
          done
          {
            echo "v7.14.2 differential dry serialization: PASS"
            sha256sum "$base"/dry.* "$cur"/dry.*
          } | tee /tmp/v715-differential.txt
      - name: Regenerate and render documentation PDFs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils imagemagick
          mkdir -p qualification/v715-doc-renders /tmp/v715-doc-pages
          docs=(
            doc/archs/lta_cation_generator_architecture.md
            doc/specs/generate_smooth_lta_cations_grouped_spec.md
            doc/specs/lta_cation_maxsym_io_spec.md
            doc/specs/lta_cation_maxsym_spec.md
            doc/specs/lta_cation_population_grouped_spec.md
            doc/specs/v7_13_group_i_ii_cation_extension.md
            doc/specs/v7_14_group_i_ii_volume_reference_extension.md
            doc/specs/v7_15_chloride_occlusion_extension.md
          )
          : > /tmp/v715-docs.txt
          for md in "${docs[@]}"; do
            pdf="${md%.md}.pdf"
            pandoc "$md" -o "$pdf" --pdf-engine xelatex --resource-path "$(dirname "$md")"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            pdftotext -layout "$pdf" - >/dev/null
            stem="$(basename "${md%.md}")"
            page_dir="/tmp/v715-doc-pages/$stem"
            mkdir -p "$page_dir"
            pdftoppm -png -r 90 "$pdf" "$page_dir/page" >/dev/null 2>&1
            montage "$page_dir"/page-*.png -thumbnail 300x -tile 4x -geometry +8+8 "qualification/v715-doc-renders/$stem.png"
            sha256sum "$pdf"
            echo "$pdf pages=$pages"
          done | tee /tmp/v715-docs.txt
          pdftotext doc/specs/v7_15_chloride_occlusion_extension.pdf - | grep -F "training hypothesis"
          pdftotext doc/specs/v7_15_chloride_occlusion_extension.pdf - | grep -F "10.1002/aic.10784"
          echo "v7.15 documentation PDF regeneration/render: PASS" | tee -a /tmp/v715-docs.txt
      - name: Record qualification output
        if: always()
        shell: bash
        run: |
          mkdir -p qualification/v715-ci
          {
            echo "head_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo
            echo "=== focused ==="
            cat /tmp/v715-focused.txt 2>/dev/null || true
            echo
            echo "=== full ==="
            cat /tmp/v715-full.txt 2>/dev/null || true
            echo
            echo "=== occluded CLI end-to-end ==="
            cat /tmp/v715-e2e.txt 2>/dev/null || true
            echo
            echo "=== v7.14.2 differential ==="
            cat /tmp/v715-differential.txt 2>/dev/null || true
            echo
            echo "=== documentation PDFs ==="
            cat /tmp/v715-docs.txt 2>/dev/null || true
          } > qualification/v715-ci/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualification/v715-ci/latest.txt qualification/v715-doc-renders \
            doc/archs/lta_cation_generator_architecture.pdf \
            doc/specs/generate_smooth_lta_cations_grouped_spec.pdf \
            doc/specs/lta_cation_maxsym_io_spec.pdf \
            doc/specs/lta_cation_maxsym_spec.pdf \
            doc/specs/lta_cation_population_grouped_spec.pdf \
            doc/specs/v7_13_group_i_ii_cation_extension.pdf \
            doc/specs/v7_14_group_i_ii_volume_reference_extension.pdf \
            doc/specs/v7_15_chloride_occlusion_extension.pdf
          git diff --cached --quiet || git commit -m "Record v7.15 qualification and regenerated PDFs [skip ci]"
          git push
